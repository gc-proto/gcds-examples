<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canada.ca</title>
    <meta name="description" content="The Government of Canada website is a single point of access to all programs, services, departments, ministries and organizations of the Government of Canada." />
    
    <!-- Dublin Core metadata for government compliance -->
    <link rel="schema.dcterms" href="http://purl.org/dc/terms/">
    <meta name="dcterms.description" content="The Government of Canada website is a single point of access to all programs, services, departments, ministries and organizations of the Government of Canada.">
    <meta name="dcterms.creator" content="Government of Canada">
    <meta name="dcterms.title" content="Canada.ca">
    <meta name="dcterms.issued" title="W3CDTF" content="2025-08-15">
    <meta name="dcterms.modified" title="W3CDTF" content="2025-08-15">
    <meta name="dcterms.subject" content="GV Government and Politics">
    <meta name="dcterms.language" title="ISO639-2" content="eng">

    <!-- GC Design System -->
    <link rel="stylesheet" href="https://cdn.design-system.alpha.canada.ca/@cdssnc/gcds-components@0.40.0/dist/gcds/gcds.css"/>
    <script type="module" src="https://cdn.design-system.alpha.canada.ca/@cdssnc/gcds-components@0.40.0/dist/gcds/gcds.esm.js"></script>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="https://wet-boew.github.io/themes-dist/GCWeb/GCWeb/assets/favicon.ico">
  </head>
  
  <body class="splash" vocab="http://schema.org/" resource="#wb-webpage" typeof="WebPage">
    
    <!-- Optional randomized background images -->
    
    <div id="bg" data-wb-randomize='{ "shuffle": true, "selector": "img", "toggle": "hide" }'>
      
      <img class="hide" src="https://www.canada.ca/content/dam/canada/splash/sp-bg-1.jpg" alt="">
      
      <img class="hide" src="https://www.canada.ca/content/dam/canada/splash/sp-bg-2.jpg" alt="">
      
      <img class="hide" src="https://www.canada.ca/content/dam/canada/splash/sp-bg-3.jpg" alt="">
      
      <img class="hide" src="https://www.canada.ca/content/dam/canada/splash/sp-bg-4.jpg" alt="">
      
      <img class="hide" src="https://www.canada.ca/content/dam/canada/splash/sp-bg-5.jpg" alt="">
      
      <img class="hide" src="https://www.canada.ca/content/dam/canada/splash/sp-bg-6.jpg" alt="">
      
      <img class="hide" src="https://www.canada.ca/content/dam/canada/splash/sp-bg-7.jpg" alt="">
      
      <img class="hide" src="https://www.canada.ca/content/dam/canada/splash/sp-bg-8.jpg" alt="">
      
      <img class="hide" src="https://www.canada.ca/content/dam/canada/splash/sp-bg-9.jpg" alt="">
      
      <img class="hide" src="https://www.canada.ca/content/dam/canada/splash/sp-bg-10.jpg" alt="">
      
      <img class="hide" src="https://www.canada.ca/content/dam/canada/splash/sp-bg-11.jpg" alt="">
      
      <img class="hide" src="https://www.canada.ca/content/dam/canada/splash/sp-bg-12.jpg" alt="">
      
    </div>
    

    <main property="mainContentOfPage" resource="#wb-main" typeof="WebPageElement">
      <div class="sp-hb">
				<div class="sp-bx col-xs-12">
          <gcds-sr-only>
  					<gcds-heading tag="h1" property="name"></gcds-heading>
          </gcds-sr-only>
					<div class="row">
						<div class="col-xs-11 col-md-8" property="publisher" resource="#wb-publisher" typeof="GovernmentOrganization">
							<img src="https://wet-boew.github.io/themes-dist/GCWeb/GCWeb/assets/sig-blk-en.svg" width="283" alt="Government of Canada" property="logo"><span class="wb-inv"> / <span lang="fr">Gouvernement du Canada</span></span>
							<meta property="name" content="Government of Canada">
							<meta property="name" lang="fr" content="Gouvernement du Canada">
							<meta property="areaServed" typeof="Country" content="Canada">
						</div>
					</div>
          
<gcds-container style="margin-top: var(--gcds-spacing-600);">
  <gcds-sr-only>
    <gcds-heading tag="h2">English / Français</gcds-heading>
  </gcds-sr-only>
  <gcds-grid columns="1" columns-tablet="12" columns-desktop="12" gap="0" style="align-items: center; width: 100%;">
    <div style="grid-column: 1 / span 5; justify-self: center;">
      <gcds-link href="/en/">English</gcds-link>
    </div>
    <div style="grid-column: 6 / span 5; justify-self: center;">
      <gcds-link href="/fr/" hreflang="fr">Français</gcds-link>
    </div>
  </gcds-grid>
</gcds-container>

        </div>
        <div class="sp-bx-bt col-xs-12">
					<div class="row">
						<div class="col-xs-7 col-md-8">
							<gcds-link href="https://www.canada.ca/en/transparency/terms.html">Terms and conditions</gcds-link> <span class="glyphicon glyphicon-asterisk"></span> <gcds-link href="https://www.canada.ca/fr/transparence/avis.html" lang="fr">Avis</gcds-link>
						</div>
						<div class="col-xs-5 col-md-4 text-right mrgn-bttm-md">
							<img src="https://wet-boew.github.io/themes-dist/GCWeb/GCWeb/assets/wmms-blk.svg" width="127" alt="Symbol of the Government of Canada"><span class="wb-inv"> / <span lang="fr">Symbole du gouvernement du Canada</span></span>
						</div>
					</div>
				</div>
			</div>
    </main>

    <!-- WET-BOEW Scripts -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.2.4/jquery.min.js" 
            integrity="sha384-rY/jv8mMhqDabXSo+UCggqKtdmBfd3qC2/KvyTDNQ6PcUJXaxK1tMepoQda4g5vB" 
            crossorigin="anonymous"></script>
    <script src="https://wet-boew.github.io/themes-dist/GCWeb/wet-boew/js/wet-boew.min.js"></script>
    <script src="https://wet-boew.github.io/themes-dist/GCWeb/GCWeb/js/theme.min.js"></script>

    <style>
    /* Minimal splash page overrides for GCWeb compatibility */
    body.splash {
      background: #f8f9fa;
    }

    /* Ensure background images work with WET-BOEW randomizer */
    #bg img {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      opacity: 0.9;
    }

    </style>
